<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.clikb-booting, html.clikb-booting body { background: var(--boot-background, #08090b) !important; }
      html.clikb-booting { overflow: hidden; }
      #clikb-loading-cover { display: none; }
      html.clikb-booting #clikb-loading-cover {
        display: grid;
        place-items: center;
        position: fixed;
        inset: 0;
        background: var(--boot-background, #08090b);
        z-index: 2147483647;
        opacity: 1;
        transition: opacity 240ms ease-out;
      }
      .clikb-loading-logo {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--boot-tile, rgba(128,128,128,0.6));
        border: 1px solid var(--boot-accent, #c2d914);
        box-shadow: 0 0 12px var(--boot-glow, #c2d91466);
      }
      .clikb-loading-logo img { width: 42px; height: 42px; display: block; border-radius: 8px; }
      .clikb-loading-logo .boot-light { display: none; }
      html[data-boot-theme="light"] .clikb-loading-logo .boot-dark { display: none; }
      html[data-boot-theme="light"] .clikb-loading-logo .boot-light { display: block; }
      html.clikb-booting #clikb-loading-cover[data-ready] { opacity: 0; }
    </style>
    <script>
      // Match App's local-time theme before any body content is painted.
      (() => {
        // Vite embeds src/themeSchedule.ts synchronously in dev and production.
        const dark = __CLIKB_SCHEDULED_DARK_MODE__;
        const root = document.documentElement;
        const accent = dark ? '#c2d914' : '#e30ed5';
        root.dataset.bootTheme = dark ? 'dark' : 'light';
        root.style.setProperty('--boot-background', dark ? '#08090b' : '#ffffff');
        root.style.setProperty('--boot-tile', dark ? 'rgba(128,128,128,0.6)' : '#ffffff');
        root.style.setProperty('--boot-accent', accent);
        root.style.setProperty('--boot-glow', accent + '66');
        root.classList.add('clikb-booting');
      })();
    </script>
